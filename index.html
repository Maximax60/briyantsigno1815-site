<!doctype html>
<html lang="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Briyant Soley Signo 1815</title>

  <!-- Style senp: Nwa ⚫️ ki fennen nan Zoranj 🍊 -->
  <style>
    :root{
      --bss-black:#0b0b0b;      /* nwa prensipal */
      --bss-orange:#fb8c00;     /* zoranj BSS */
      --bss-orange-2:#ffb04a;   /* zoranj limyè pou fade */
      --text:#f2f2f2;
      --muted:#cfcfcf;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 75% 45%, var(--bss-orange-2) 0%, transparent 60%),
        radial-gradient(900px 500px at 60% 50%, var(--bss-orange) 0%, transparent 55%),
        linear-gradient(180deg, var(--bss-black) 15%, #111 100%);
      background-color: var(--bss-black);
    }
    .wrap{
      min-height:100%;
      display:flex;
      flex-direction:column;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:20px clamp(16px,4vw,40px);
      backdrop-filter: blur(4px);
    }
    .brand{
      display:flex; align-items:center; gap:14px;
    }
    .brand img{
      width:56px; height:56px; object-fit:contain;
      border-radius:50%;
      background:#00000055; padding:6px;
      box-shadow: 0 0 0 1px #ffffff14, 0 8px 24px #00000066;
    }
    .brand .name{
      font-weight:800; letter-spacing:.06em; line-height:1.05;
      text-transform:uppercase;
    }
    .name small{ display:block; color:var(--muted); font-weight:600; letter-spacing:.18em; }
    main{
      flex:1;
      display:grid;
      place-items:center;
      padding:40px 20px 72px;
      text-align:center;
    }
    .hero{
      max-width:980px;
    }
    h1{
      margin:0 0 8px;
      font-size: clamp(36px, 7vw, 68px);
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
      line-height:1;
      text-shadow: 0 2px 0 #0008, 0 18px 40px #000a;
    }
    .tag{
      margin:0 0 26px;
      font-size: clamp(14px, 2.6vw, 18px);
      color:var(--muted);
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .slogan{
      margin:10px auto 28px;
      font-size: clamp(18px, 3.6vw, 26px);
      font-weight:700;
      letter-spacing:.02em;
      color:#fff;
    }
    .cta{
      display:inline-flex; gap:14px; flex-wrap:wrap; justify-content:center;
    }
    .btn{
      border:none; cursor:pointer;
      padding:14px 20px;
      font-weight:700; letter-spacing:.06em; text-transform:uppercase;
      border-radius:999px;
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .btn--primary{
      background:linear-gradient(90deg, var(--bss-orange), var(--bss-orange-2));
      color:#111;
      box-shadow: 0 10px 24px #0009, 0 0 0 1px #0006 inset;
    }
    .btn--ghost{
      background:#ffffff12; color:#fff;
      box-shadow:inset 0 0 0 1px #ffffff22;
    }
    .btn:active{ transform: translateY(2px) }
    footer{
      padding:18px clamp(16px,4vw,40px);
      color:#bdbdbd; font-size:14px;
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
      border-top:1px solid #ffffff14;
      background: #00000033;
    }
    a{ color:#ffd59a; text-decoration:none }
    a:hover{ text-decoration:underline }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- HEADER -->
    <header>
      <div class="brand">
        <!-- Mete fichye logo w la nan: /assets/logo.png -->
        <img src="assets/logo.png" alt="BSS Logo" />
        <div class="name">
          BRIYANT SOLEY<br/>SIGNO 1815
          <small>BRIYANT SOLEY TOUJOU KLERE</small>
        </div>
      </div>
    </header>

    <!-- HERO -->
    <main>
      <section class="hero">
        <h1>BRIYANT SOLEY<br/>SIGNO 1815</h1>
        <p class="tag">Sit ofisyèl</p>

        <!-- SLOGANS yo (san aksan sou KLE) -->
        <p class="slogan">YON MOTÈ NÈF · YON SEL KOUT KLE</p>
        <p class="slogan" style="opacity:.9;">BRIYANT SOLEY TOUJOU KLERE</p>

        <div class="cta">
          <a class="btn btn--primary" href="#kontak">Kontak</a>
          <a class="btn btn--ghost" href="#dokiman">Dokiman</a>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <span>© <span id="y"></span> BSS · Tout dwa rezève.</span>
      <span><a href="#privasi">Règleman prive</a> · <a href="#tèm">Tèm sèvis</a></span>
    </footer>
  </div>

  <script>
    // Mete ane a otomatikman – pa gen lòt JS
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
